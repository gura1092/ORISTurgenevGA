services:
  postgres:
    image: postgres:17-alpine
    container_name: homework10-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homework10
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5435:5432"
    volumes:
      - homework10_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homework10"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  homework10_postgres_data:
