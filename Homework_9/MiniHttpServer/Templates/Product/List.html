<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список продуктов OrisDb</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f3f3f3; }
        .empty { color: #666; }
    </style>
</head>
<body>
    <h1>Список продуктов из PostgreSQL</h1>
    <table>
        <thead>
            <tr><th>Id</th><th>Название</th><th>Цена</th><th>Описание</th></tr>
        </thead>
        <tbody>
$foreach(var product in Products)
            <tr><td>${product.Id}</td><td>${product.Name}</td><td>${product.Price}</td><td>${product.Description}</td></tr>
$endfor
        </tbody>
    </table>
    <p><a href="/User/List">Пользователи</a> | <a href="/User/Profile">Профиль</a></p>
</body>
</html>
